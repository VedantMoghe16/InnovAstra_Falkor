# Render blueprint for the live API (free plan, lean profile).
# Secrets are marked sync: false and set in the dashboard or via the API, never committed.
services:
  - type: web
    name: rudra-api
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile.deploy
    dockerContext: .
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: RUDRA_LITE
        value: "1"
      - key: RUDRA_LLM_RUNS_PER_HOUR
        value: "20"
      - key: RUDRA_GEMINI_MODEL
        value: gemini-2.5-flash
      - key: STREAM_BACKEND
        value: inproc
      - key: FALKORDB_GRAPH
        value: rudra
      - key: FALKORDB_HOST
        sync: false
      - key: FALKORDB_PORT
        sync: false
      - key: FALKORDB_USERNAME
        sync: false
      - key: FALKORDB_PASSWORD
        sync: false
      - key: GEMINI_API_KEY
        sync: false
